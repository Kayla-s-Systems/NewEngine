# GameFirst workspace: editor/preview/gizmo crates are intentionally not members.
# Editor tooling will return later as a separate product layer, not as runtime ballast.
[profile.dev.package.sha2]
# Plugin discovery hashes release DLLs during dev startup. SHA-256 is integrity
# work, not debug-target code; compiling it at O0 turned a 31 MiB artifact hash
# into multi-second launcher stalls. Keep engine crates debuggable while allowing
# the cryptographic primitive itself to run at production speed.
opt-level = 3
