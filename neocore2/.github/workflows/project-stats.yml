name: Project Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calculate project age
        run: |
          CREATED=$(git log --reverse --format=%cd --date=short | head -1)
          NOW=$(date +%s)
          CREATED_TS=$(date -d "$CREATED" +%s)
          DAYS=$(( (NOW - CREATED_TS) / 86400 ))

          echo "{ \"schemaVersion\": 1, \"label\": \"days\", \"message\": \"$DAYS\", \"color\": \"black\" }" > age.json

      - name: Commit badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add age.json
          git commit -m "Update project age badge" || echo "No changes"
          git push