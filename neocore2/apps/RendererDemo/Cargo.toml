[package]
name = "renderer-demo"
version = "0.1.0"
edition = "2021"
description = "NewEngine renderer demo launcher: shaded lit scene smoke target"
authors = ["Take Some()"]
license = "Proprietary"

[package.metadata.newengine.winres]
icon = "assets/editor.ico"

[dependencies]
newengine-core = { path = "../../crates/newengine-core" }
newengine-game-ready-profile = { path = "../../crates/newengine-game-ready-profile" }
newengine-runtime-host = { path = "../../crates/newengine-runtime-host", default-features = false, features = ["full-runtime"] }
newengine-windowed-host-runtime = { path = "../../crates/newengine-windowed-host-runtime", default-features = false, features = ["prestart-window-egui", "window-icon"] }
newengine-ui = { path = "../../crates/newengine-ui", default-features = false }

[build-dependencies]
embed-resource = "2"
