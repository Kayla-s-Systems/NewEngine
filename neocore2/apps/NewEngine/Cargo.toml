[package]
name = "newengine"
version = "0.1.3"
build = "build.rs"
edition = "2021"
description = "North Star standalone engine/runtime launcher"
authors = ["Take Some()"]
license = "Proprietary"

[package.metadata.newengine.winres]
icon = "ROOT-DIR/Shared/Source/branding/logo.ico"
product_name = "North Star NewEngine"
original_filename = "NewEngine.exe"

[[bin]]
name = "NewEngine"
path = "src/main.rs"

[dependencies]
newengine-project-api = { workspace = true }
newengine-project-runtime = { workspace = true }
newengine-game-module-api = { workspace = true }
newengine-plugin-api = { workspace = true }
newengine-plugin-host = { workspace = true }
newengine-runtime-host = { workspace = true, default-features = false, features = ["full-runtime"] }
newengine-core = { workspace = true }
serde_json = "1"
toml = "1.1.4"

[build-dependencies]
embed-resource = "3.0.11"
