[package]
name = "aurelia-ui-test"
version = "0.1.0"
edition = "2021"
description = "North Star Engine minimal Aurelia UI runtime test application"
authors = ["Take Some()"]
license = "Proprietary"

[dependencies]
newengine-ulog-api = { path = "../../crates/newengine-ulog-api" }
newengine-core = { path = "../../crates/newengine-core" }
newengine-engine-runtime = { path = "../../crates/newengine-engine-runtime" }
newengine-runtime-host = { path = "../../crates/newengine-runtime-host", default-features = false, features = ["full-runtime"] }
newengine-windowed-host-runtime = { path = "../../crates/newengine-windowed-host-runtime", default-features = false, features = ["prestart-window-egui", "window-icon"] }
newengine-render-runtime-adapter = { path = "../../crates/newengine-render-runtime-adapter" }
newengine-scene = { path = "../../crates/newengine-scene" }
newengine-scene-runtime = { path = "../../crates/newengine-scene-runtime" }
newengine-ui = { path = "../../crates/newengine-ui" }
newengine-ui-api = { path = "../../crates/newengine-ui-api" }
newengine-assets = { path = "../../crates/newengine-assets" }
newengine-assets-api = { path = "../../crates/newengine-assets-api" }
newengine-assets-ui-runtime = { path = "../../crates/newengine-assets-ui-runtime" }
newengine-plugin-host = { path = "../../crates/newengine-plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
