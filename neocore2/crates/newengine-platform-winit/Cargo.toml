[package]
name = "winit-platform"
version = "0.1.0"
readme = "README.md"
edition = "2021"
build = "build.rs"
description = "NewEngine winit platform"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
raw-window-handle = "0.6.2"
log = "0.4.29"
serde_json = "1.0.149"
abi_stable = "0.11"
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-platform-api = { path = "../newengine-platform-api" }

[build-dependencies]
embed-resource = "3.0.6"
