[package]
name = "newengine-asset-hot-reload-runtime"
version = "0.1.0"
edition = "2021"
description = "Project/content file watcher and dependency-aware asset hot reload for NewEngine"

[dependencies]
newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-core = { path = "../newengine-core" }
newengine-project-api = { path = "../newengine-project-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
