[package]
name = "newengine-game-events-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Game message registry and bounded queue runtime for NewEngine"

[dependencies]
newengine-core = { path = "../newengine-core" }
newengine-game-events-api = { path = "../newengine-game-events-api" }
parking_lot = "0.12"
serde_json = "1"
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
