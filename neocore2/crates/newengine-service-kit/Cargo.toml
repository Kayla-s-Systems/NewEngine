[package]
name = "newengine-service-kit"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Common ServiceV1 JSON router and engine-runtime provider-route registration helpers for NewEngine"

[dependencies]
newengine-ulog-api = { path = "../newengine-ulog-api" }
abi_stable = "0.11"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-service-api = { path = "../newengine-service-api" }
