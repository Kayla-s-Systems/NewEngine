[package]
name = "newengine-model-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Gateway-backed model construction runtime for NewEngine"

[dependencies]
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-runtime-unit-api = { path = "../newengine-runtime-unit-api" }
newengine-asset-format-nef8 = { path = "../newengine-asset-format-nef8" }
abi_stable = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

newengine-assets-api = { path = "../newengine-assets-api" }
newengine-authored-xml = { path = "../newengine-authored-xml" }
newengine-material-runtime = { path = "../newengine-material-runtime" }
newengine-materials = { path = "../newengine-materials", features = ["serde"] }
newengine-model-collision-runtime = { path = "../newengine-model-collision-runtime" }
newengine-model-domain-api = { path = "../newengine-model-domain-api" }
newengine-model-client = { path = "../newengine-model-client" }
newengine-model-import-obj = { path = "../newengine-model-import-obj" }
newengine-model-skeleton-api = { path = "../newengine-model-skeleton-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-primitives = { path = "../newengine-primitives", features = ["serde"] }
newengine-math = { path = "../newengine-math", features = ["serde"] }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-ulog-api = { path = "../newengine-ulog-api" }

newengine-runtime-env = { path = "../newengine-runtime-env" }

newengine-render-api = { path = "../newengine-render-api" }
