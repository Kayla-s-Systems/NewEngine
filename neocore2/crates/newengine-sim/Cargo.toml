[package]
name = "newengine-sim"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
newengine-ecs = { path = "../newengine-ecs" }
newengine-transform-api = { path = "../newengine-transform-api", features = ["ecs"], default-features = false }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-camera = { path = "../newengine-camera" }
newengine-math = { path = "../newengine-math" }
rayon = { version = "1.10", optional = true }
