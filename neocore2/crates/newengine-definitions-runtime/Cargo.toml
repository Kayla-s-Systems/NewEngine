[package]
name = "newengine-definitions-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Runtime-hosted runtime definitions gateway for NewEngine .ytyp Definition Entry dictionaries"

[dependencies]
abi_stable = "0.11"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-authored-xml = { path = "../newengine-authored-xml" }
