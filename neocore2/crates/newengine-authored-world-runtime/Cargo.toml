[package]
name = "newengine-authored-world-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Generic authored YMAP-to-scene runtime for NewEngine"
license = "Proprietary"

[dependencies]
newengine-materials = { path = "../newengine-materials" }
newengine-world-runtime-api = { path = "../newengine-world-runtime-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = '0.12'
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-core = { path = "../newengine-core" }
newengine-definitions-runtime = { path = "../newengine-definitions-runtime" }
newengine-ecs = { path = "../newengine-ecs" }
newengine-engine-runtime = { path = "../newengine-engine-runtime" }
newengine-math = { path = "../newengine-math" }
newengine-physics-contracts = { path = "../newengine-physics-contracts" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-primitives = { path = "../newengine-primitives" }
newengine-project-api = { path = "../newengine-project-api" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-scene-runtime = { path = "../newengine-scene-runtime" }
newengine-transform = { path = "../newengine-transform", features = ["ecs"], default-features = false }
newengine-ulog-api = { path = "../newengine-ulog-api" }
newengine-ui-api = { path = "../newengine-ui-api" }
newengine-bounds = { path = "../newengine-bounds" }
newengine-material-domain-api = { path = "../newengine-material-domain-api" }
newengine-material-runtime = { path = "../newengine-material-runtime" }
newengine-model-domain-api = { path = "../newengine-model-domain-api" }
newengine-model-runtime = { path = "../newengine-model-runtime" }
newengine-sim = { path = "../newengine-sim" }
newengine-world-authoring-api = { path = "../newengine-world-authoring-api" }
newengine-runtime-env = { path = "../newengine-runtime-env" }
