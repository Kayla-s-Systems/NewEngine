[package]
name = "newengine-audio-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "First-party native audio provider for the NewEngine engine.audio gateway"

[dependencies]
abi_stable = "0.11"
serde_json = "1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
newengine-audio-api = { path = "../newengine-audio-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-ulog-api = { path = "../newengine-ulog-api" }
