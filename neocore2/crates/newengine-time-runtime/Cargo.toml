[package]
name = "newengine-time-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Engine-owned baseline time provider for NewEngine"

[dependencies]
abi_stable = "0.11"
log = "0.4"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-time-api = { path = "../newengine-time-api" }
