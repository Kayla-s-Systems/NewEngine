[package]
name = "newengine-gameplay-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Core-owned replaceable baseline gameplay providers for tags, tasks, animation, navigation and AI"
license = "Proprietary"

[dependencies]
abi_stable = "0.11"
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
newengine-ai-api = { path = "../newengine-ai-api" }
newengine-animation-api = { path = "../newengine-animation-api" }
newengine-navigation-api = { path = "../newengine-navigation-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-tags-api = { path = "../newengine-tags-api" }
newengine-tasks-api = { path = "../newengine-tasks-api" }
