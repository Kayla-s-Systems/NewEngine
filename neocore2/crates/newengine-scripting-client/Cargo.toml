[package]
name = "newengine-scripting-client"
version = "0.1.0"
edition = "2021"
description = "Typed client for asset-backed engine.scripting modules"
license = "Proprietary"

[dependencies]
newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-core = { path = "../newengine-core", features = ["host-probe"] }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-scripting-api = { path = "../newengine-scripting-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
