[package]
name = "newengine-ui"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
default = ["egui"]
egui = ["provider-egui"]
provider-egui = ["dep:winit", "dep:egui", "dep:egui-winit"]
provider-null = []

# Optional adapter to the AssetManager crate.
#
# Keeping this behind a feature allows `newengine-ui` to be used in tools/headless builds
# or minimal hosts without pulling the whole asset pipeline.
assets = ["dep:newengine-assets"]

# Image decoding for UI textures (icons, textured widgets).
images = ["dep:image"]

[dependencies]
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-assets = { path = "../newengine-assets", optional = true }
newengine-math = { path = "../newengine-math" }
roxmltree = "0.21.1"
smallvec = "1.13"
abi_stable = "0.11"
bytemuck = { version = "1.16", features = ["derive"] }

winit = { version = "0.30", optional = true }
egui = { version = "0.33.3", optional = true }
egui-winit = { version = "0.33.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22"

image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"], optional = true }