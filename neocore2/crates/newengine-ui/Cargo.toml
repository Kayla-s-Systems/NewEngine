[package]
name = "newengine-ui"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
default = ["provider-null"]
provider-null = []


# Optional adapter to the AssetManager crate.
#
# Keeping this behind a feature allows `newengine-ui` to be used in tools/headless builds
# or minimal hosts without pulling the whole asset pipeline.
assets = ["dep:newengine-assets"]

# Runtime UI texture bridge. Decoding happens inside AssetManager importers; UI consumes RGBA8 packets only.
images = []

[dependencies]
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-assets = { path = "../newengine-assets", optional = true }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-ui-draw = { path = "../newengine-ui-draw" }
newengine-math = { path = "../newengine-math" }

roxmltree = "0.21.1"
smallvec = "1.13"
abi_stable = "0.11"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22"

