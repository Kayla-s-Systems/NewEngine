[package]
name = "newengine-assets"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "NewEngine AssetManager (store + importer host)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11"
newengine-plugin-api = { path = "../newengine-plugin-api" }

blake3 = "1.5"
parking_lot = "0.12"
log = "0.4.29"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
thiserror = "1.0"

libloading = "0.8"

[build-dependencies]
embed-resource = "2"