[package]
name = "newengine-maps-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Semantic engine.assets.maps gateway for discrete North Star YMAP maps"
license = "Proprietary"

[dependencies]
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-authored-xml = { path = "../newengine-authored-xml" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
