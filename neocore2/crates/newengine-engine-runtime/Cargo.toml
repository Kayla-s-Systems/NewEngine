[package]
name = "newengine-engine-runtime"
version = "0.3.0"
edition = "2021"
readme = "README.md"
description = "Reusable GameFirst runtime scene and render controller layer for NewEngine"

[features]
default = []

[dependencies]
newengine-ulog-api = { path = "../newengine-ulog-api" }
abi_stable = { version = "0.11" }
blake3 = "1"
crossbeam-channel = "0.5"
libloading = "0.9"
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-audio-api = { path = "../newengine-audio-api" }
newengine-audio-client = { path = "../newengine-audio-client" }
newengine-audio-world-api = { path = "../newengine-audio-world-api" }
newengine-bounds = { path = "../newengine-bounds" }
newengine-camera = { path = "../newengine-camera" }
newengine-camera-api = { path = "../newengine-camera-api" }
newengine-camera-contracts = { path = "../newengine-camera-contracts" }
newengine-camera-runtime = { path = "../newengine-camera-runtime" }
newengine-core = { path = "../newengine-core", features = ["render-api", "physics-api"] }
newengine-input-actions-api = { path = "../newengine-input-actions-api" }
newengine-input-systems-runtime = { path = "../newengine-input-systems-runtime" }
newengine-input-capture-api = { path = "../newengine-input-capture-api" }
newengine-input-api = { path = "../newengine-input-api" }
newengine-input-bindings-api = { path = "../newengine-input-bindings-api" }
newengine-input-bindings-runtime = { path = "../newengine-input-bindings-runtime" }
newengine-task-api = { path = "../newengine-task-api" }
newengine-ecs = { path = "../newengine-ecs" }
newengine-ecs-api = { path = "../newengine-ecs-api" }
newengine-entity-api = { path = "../newengine-entity-api" }
newengine-editor-viewport-runtime = { path = "../newengine-editor-viewport-runtime" }
newengine-lighting = { path = "../newengine-lighting" }
newengine-materials = { path = "../newengine-materials", features = ["serde"] }
newengine-material-domain-api = { path = "../newengine-material-domain-api" }
newengine-model-domain-api = { path = "../newengine-model-domain-api" }
newengine-model-client = { path = "../newengine-model-client" }
newengine-model-skeleton-api = { path = "../newengine-model-skeleton-api" }
newengine-physics-contracts = { path = "../newengine-physics-contracts" }
newengine-physics-api = { path = "../newengine-physics-api" }
newengine-math = { path = "../newengine-math" }
newengine-platform-api = { path = "../newengine-platform-api" }
newengine-project-api = { path = "../newengine-project-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-replay = { path = "../newengine-replay" }
newengine-render-api = { path = "../newengine-render-api" }
newengine-primitives = { path = "../newengine-primitives" }
newengine-procedural-noise = { path = "../newengine-procedural-noise" }
newengine-world-authority-runtime = { path = "../newengine-world-authority-runtime" }
newengine-render-runtime-adapter = { path = "../newengine-render-runtime-adapter" }
newengine-physics-runtime-adapter = { path = "../newengine-physics-runtime-adapter" }
newengine-runtime-session-api = { path = "../newengine-runtime-session-api" }
newengine-runtime-session-runtime = { path = "../newengine-runtime-session-runtime" }
newengine-render-feature-api = { path = "../newengine-render-feature-api" }
newengine-render-frame-graph = { path = "../newengine-render-frame-graph" }
newengine-scene-authoring-api = { path = "../newengine-scene-authoring-api" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-scene-io = { path = "../newengine-scene-io" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-sim = { path = "../newengine-sim" }
newengine-transform = { path = "../newengine-transform", features = ["ecs", "service"], default-features = false }
newengine-transform-api = { path = "../newengine-transform-api" }
newengine-texture-container = { path = "../newengine-texture-container" }
newengine-ui = { path = "../newengine-ui", default-features = false }
newengine-ui-api = { path = "../newengine-ui-api" }
newengine-ui-navigation-api = { path = "../newengine-ui-navigation-api" }
newengine-viewport = { path = "../newengine-viewport" }
newengine-viewport-bridge = { path = "../newengine-viewport-bridge" }
newengine-vfx-api = { path = "../newengine-vfx-api" }
newengine-world-authoring-api = { path = "../newengine-world-authoring-api" }
newengine-world-environment-api = { path = "../newengine-world-environment-api" }

