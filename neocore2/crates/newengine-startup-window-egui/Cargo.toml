[package]
name = "newengine-startup-window-egui"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Optional Egui PreStart presenter provider for NewEngine host compositions"

[dependencies]
newengine-core = { path = "../newengine-core", default-features = false }
newengine-loading-api = { path = "../newengine-loading-api" }
serde_json = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
