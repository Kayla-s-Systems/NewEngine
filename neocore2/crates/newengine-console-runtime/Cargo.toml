[package]
name = "newengine-console-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Optional engine.command provider implementation outside the NewEngine host kernel"

[dependencies]
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
newengine-console-api = { path = "../newengine-console-api" }
newengine-core = { path = "../newengine-core", default-features = false }
newengine-math = { path = "../newengine-math" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-service-kit = { path = "../newengine-service-kit" }
