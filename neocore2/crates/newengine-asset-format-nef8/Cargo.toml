[package]
name = "newengine-asset-format-nef8"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
flate2 = "1"
newengine-contract-api = { path = "../newengine-contract-api" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-vfx-api = { path = "../newengine-vfx-api" }

[dev-dependencies]
hound = "3.5"
newengine-audio-xvag = { path = "../newengine-audio-xvag" }

[features]
default = []
