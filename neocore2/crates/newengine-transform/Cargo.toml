[package]
name = "newengine-transform"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[dependencies]
newengine-transform-api = { path = "../newengine-transform-api", default-features = false }
newengine-math = { path = "../newengine-math" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-ecs = { path = "../newengine-ecs", optional = true }

# Engine-host integration (service registry) is intentionally opt-in.
newengine-core = { path = "../newengine-core", default-features = false, optional = true }

[features]
default = []

# ECS integration layer (hierarchy + propagation + world-space helpers).
ecs = ["dep:newengine-ecs"]

# Registers transform runtime into the engine service registry.
service = ["ecs", "dep:newengine-core"]
