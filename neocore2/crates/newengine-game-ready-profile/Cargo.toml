[package]
name = "newengine-game-ready-profile"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Game Ready FPS runtime profile composition for NewEngine"

[dependencies]
newengine-asset-format-nef8 = { path = "../newengine-asset-format-nef8" }
log = "0.4"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-ui-runtime = { path = "../newengine-assets-ui-runtime" }
newengine-assets-catalog-ui-runtime = { path = "../newengine-assets-catalog-ui-runtime" }
newengine-core = { path = "../newengine-core", features = ["host-probe"] }
newengine-definitions-runtime = { path = "../newengine-definitions-runtime" }
newengine-ecs-runtime = { path = "../newengine-ecs-runtime" }
newengine-engine-runtime = { path = "../newengine-engine-runtime" }
newengine-input-bindings-runtime = { path = "../newengine-input-bindings-runtime" }
newengine-input-profile-gameready = { path = "../newengine-input-profile-gameready" }
newengine-material-runtime = { path = "../newengine-material-runtime" }
newengine-model-runtime = { path = "../newengine-model-runtime" }
newengine-entity-runtime = { path = "../newengine-entity-runtime" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-render-feature-api = { path = "../newengine-render-feature-api" }
newengine-render-feature-gameready = { path = "../newengine-render-feature-gameready" }
newengine-render-ui-bridge = { path = "../newengine-render-ui-bridge" }
newengine-runtime-host = { path = "../newengine-runtime-host" }
newengine-time-runtime = { path = "../newengine-time-runtime" }
newengine-textures-runtime = { path = "../newengine-textures-runtime" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-scene-runtime = { path = "../newengine-scene-runtime" }
newengine-world-runtime = { path = "../newengine-world-runtime" }
newengine-world-environment-runtime = { path = "../newengine-world-environment-runtime" }
newengine-scripting-runtime = { path = "../newengine-scripting-runtime" }
newengine-ui = { path = "../newengine-ui", default-features = false }
