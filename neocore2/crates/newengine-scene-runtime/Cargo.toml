[package]
name = "newengine-scene-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Runtime-hosted scene gateway runtime service for NewEngine"

[dependencies]
newengine-asset-format-nef8 = { path = "../newengine-asset-format-nef8" }
abi_stable = "0.11"
log = "0.4"
serde_json = "1"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-engine-runtime = { path = "../newengine-engine-runtime" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-scene-io = { path = "../newengine-scene-io" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-runtime-host = { path = "../newengine-runtime-host" }

newengine-world-api = { path = "../newengine-world-api" }
