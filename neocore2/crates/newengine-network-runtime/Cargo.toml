[package]
name = "newengine-network-runtime"
version = "0.1.0"
edition = "2021"
description = "Nonblocking UDP networking provider for NewEngine replication contracts"

[dependencies]
abi_stable = "0.11"
newengine-network-api = { path = "../newengine-network-api" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-replication-api = { path = "../newengine-replication-api" }
newengine-replication-runtime = { path = "../newengine-replication-runtime" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
