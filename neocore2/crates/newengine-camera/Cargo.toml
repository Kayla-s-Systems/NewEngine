[package]
name = "newengine-camera"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
default = []
serde = ["dep:serde", "newengine-math/serde"]

[dependencies]
newengine-math = { path = "../newengine-math" }
bytemuck = { version = "1.16", features = ["derive"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
