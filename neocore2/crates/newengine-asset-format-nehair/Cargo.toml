[package]
name = "newengine-asset-format-nehair"
version = "0.1.0"
edition = "2021"
description = "Native NorthStar compiled hair/groom asset format"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
newengine-math = { path = "../newengine-math" }
newengine-model-skeleton-api = { path = "../newengine-model-skeleton-api" }
newengine-render-api = { path = "../newengine-render-api" }
