[package]
name = "newengine-system-runtime"
version = "0.1.0"
readme = "README.md"
edition = "2021"
description = "Runtime helpers for mapping subsystem state into NewEngine system-layer contracts."
license = "MIT OR Apache-2.0"

[dependencies]
newengine-ulog-api = { path = "../newengine-ulog-api" }
log = "0.4.29"
abi_stable = "0.11"
newengine-core = { path = "../newengine-core", features = ["render-api"] }
newengine-platform-api = { path = "../newengine-platform-api" }
newengine-system-contracts = { path = "../newengine-system-contracts" }
newengine-ui = { path = "../newengine-ui", default-features = false }
parking_lot = "0.12.5"

serde_json = "1.0.149"
