[package]
name = "newengine-material-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime material mapping for model construction"

[dependencies]
newengine-asset-format-nef8 = { path = "../newengine-asset-format-nef8" }
log = "0.4"
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

newengine-assets = { path = "../newengine-assets" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-authored-xml = { path = "../newengine-authored-xml" }
newengine-materials = { path = "../newengine-materials", features = ["serde"] }
newengine-model-domain-api = { path = "../newengine-model-domain-api" }
newengine-model-import-obj = { path = "../newengine-model-import-obj" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
