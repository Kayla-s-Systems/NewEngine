[package]
name = "newengine-scene"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
# Pure scene-domain types (GUIDs, semantic components, settings) by default.
default = []

# Runtime integration layer (ECS world + transform/bounds systems).
# This is intentionally opt-in to keep the scene domain isolated.
runtime = [
    "dep:newengine-ecs",
    "dep:newengine-transform",
    "dep:newengine-bounds",
]

[dependencies]
newengine-ecs = { path = "../newengine-ecs", optional = true }
newengine-transform = { path = "../newengine-transform", optional = true, features = ["ecs"], default-features = false }
newengine-transform-api = { path = "../newengine-transform-api" }
newengine-bounds = { path = "../newengine-bounds", optional = true }
newengine-math = { path = "../newengine-math" }
serde = { version = "1.0", features = ["derive"] }
