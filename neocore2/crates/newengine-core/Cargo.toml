[package]
name = "newengine-core"
version = "0.1.0"
readme = "README.md"
edition = "2021"

[features]
# The startup configuration presenter is part of newengine-core but remains an
# explicit build/runtime capability. It is never a separate settings crate and
# is shown only when the launch contract requests PreStartConfigWindow.
default = []
startup-window-egui = ["dep:eframe"]

# Optional host diagnostics. Keep disabled by default: diagnostics are explicit.
host-probe = ["dep:sysinfo", "dep:windows"]
native-crash-handlers = ["dep:windows"]

[dependencies]
newengine-ulog-api = { path = "../newengine-ulog-api" }
crossbeam-channel = "0.5"
log = { version = "0.4.29", features = ["std"] }
raw-window-handle = "0.6.2"
abi_stable = "0.11"
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-platform-api = { path = "../newengine-platform-api" }
newengine-math = { path = "../newengine-math" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-render-api = { path = "../newengine-render-api" }
newengine-physics-api = { path = "../newengine-physics-api" }
newengine-assets-api = { path = "../newengine-assets-api" }
newengine-audio-api = { path = "../newengine-audio-api" }
newengine-camera-api = { path = "../newengine-camera-api" }
newengine-ecs-api = { path = "../newengine-ecs-api" }
newengine-entity-api = { path = "../newengine-entity-api" }
newengine-ui-api = { path = "../newengine-ui-api" }
newengine-loading-api = { path = "../newengine-loading-api" }
newengine-task-api = { path = "../newengine-task-api" }
newengine-time-api = { path = "../newengine-time-api" }
newengine-input-api = { path = "../newengine-input-api" }
newengine-input-bindings-api = { path = "../newengine-input-bindings-api" }
newengine-scene-io = { path = "../newengine-scene-io" }
newengine-world-api = { path = "../newengine-world-api" }
newengine-materials = { path = "../newengine-materials" }
newengine-ui-draw = { path = "../newengine-ui-draw" }


serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
parking_lot = "0.12.5"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
sysinfo = { version = "0.38.3", default-features = true, optional = true }

# Windows-only GPU/DX probe
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_System_Diagnostics_Debug",
] }