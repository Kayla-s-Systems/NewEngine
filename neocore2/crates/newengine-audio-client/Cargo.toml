[package]
name = "newengine-audio-client"
version = "0.8.0"
edition = "2021"
readme = "README.md"
description = "Provider-neutral typed client for the stable engine.audio gateway"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
newengine-audio-api = { path = "../newengine-audio-api" }
newengine-camera-contracts = { path = "../newengine-camera-contracts" }
newengine-core = { path = "../newengine-core", default-features = false }
newengine-ulog-api = { path = "../newengine-ulog-api" }
