[package]
name = "newengine-asset-bootstrap-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Content root and asset bootstrap policy outside the NewEngine host"

[features]
default = []
window-icon = ["dep:abi_stable"]

[dependencies]
newengine-ulog-api = { path = "../newengine-ulog-api" }
newengine-assets = { path = "../newengine-assets" }
newengine-math = { path = "../newengine-math" }
newengine-platform-api = { path = "../newengine-platform-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
serde_json = "1"
abi_stable = { version = "0.11", optional = true }
