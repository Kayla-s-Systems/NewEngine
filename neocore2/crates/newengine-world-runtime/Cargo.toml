[package]
name = "newengine-world-runtime"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Runtime-hosted engine.world gateway service for North Star Engine"
license = "Proprietary"

[dependencies]
newengine-runtime-unit-api = { path = "../newengine-runtime-unit-api" }
newengine-ulog-api = { path = "../newengine-ulog-api" }
abi_stable = "0.11"
log = "0.4"
parking_lot = "0.12"
serde = "1"
serde_json = "1"

newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-scene-runtime = { path = "../newengine-scene-runtime" }
newengine-world-authority-runtime = { path = "../newengine-world-authority-runtime" }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-world-api = { path = "../newengine-world-api" }
