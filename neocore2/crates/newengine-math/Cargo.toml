[package]
name = "newengine-math"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[features]
# `newengine-math` is the single dependency point for math + low-level deterministic foundations.
default = ["backend-glam", "collections"]

## Temporary backend: re-export glam types while the engine migrates.
## When we replace the backend, the public API of this crate must stay stable.
backend-glam = ["dep:glam"]

## Serde support for math types.
serde = ["dep:serde", "glam?/serde"]

## Shared deterministic collections + ids (re-exported).
collections = ["dep:hashbrown", "dep:slotmap", "dep:fxhash"]

[dependencies]
ahash = "0.8"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"], optional = true }

# Shared foundation deps (only used when `collections` is enabled).
hashbrown = { version = "0.16.1", optional = true }
slotmap = { version = "1.1.1", optional = true }
fxhash = { version = "0.2", optional = true }

# NOTE: We intentionally keep glam as an implementation detail of the engine math layer.
# Other crates must not depend on glam directly.
glam = { version = "0.32.0", default-features = false, features = ["std", "libm"], optional = true }