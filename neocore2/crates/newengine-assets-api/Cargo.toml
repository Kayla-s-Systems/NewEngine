[package]
name = "newengine-assets-api"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[dependencies]
newengine-contract-api = { path = "../newengine-contract-api" }
newengine-ulog-api = { path = "../newengine-ulog-api" }
abi_stable = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
