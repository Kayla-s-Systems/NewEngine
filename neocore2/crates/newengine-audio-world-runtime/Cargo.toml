[package]
name = "newengine-audio-world-runtime"
version = "0.6.0"
edition = "2021"
readme = "README.md"
description = "World-facing spatial audio scene, ambience and engine.audio gateway runtime for North Star"

[dependencies]
abi_stable = "0.11"
parking_lot = "0.12"
newengine-audio-api = { path = "../newengine-audio-api" }
newengine-audio-client = { path = "../newengine-audio-client" }
newengine-audio-world-api = { path = "../newengine-audio-world-api" }
newengine-core = { path = "../newengine-core", default-features = false }
newengine-ecs = { path = "../newengine-ecs" }
newengine-math = { path = "../newengine-math" }
newengine-plugin-api = { path = "../newengine-plugin-api" }
newengine-plugin-host = { path = "../newengine-plugin-host" }
newengine-runtime-unit-api = { path = "../newengine-runtime-unit-api" }
newengine-scene = { path = "../newengine-scene", features = ["runtime"] }
newengine-service-api = { path = "../newengine-service-api" }
newengine-service-kit = { path = "../newengine-service-kit" }
newengine-transform = { path = "../newengine-transform", features = ["ecs", "service"], default-features = false }
newengine-ulog-api = { path = "../newengine-ulog-api" }
