name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v7

      - name: Verify checkout revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$actual"
          test "$actual" = "$GITHUB_SHA"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2

      - name: Cargo workspace metadata preflight
        run: cargo metadata --format-version 1 --no-deps > /dev/null
        shell: bash

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: No hidden runtime executors
        run: python scripts/no_hidden_thread_scan.py

      - name: No legacy runtime aliases
        run: python scripts/no_legacy_scan.py

      - name: Gateway contract scan
        run: python scripts/gateway_contract_scan.py

      - name: Provider boundary scan
        run: python scripts/provider_boundary_scan.py

      - name: No product-specific UI provider branches
        run: python scripts/no_product_ui_provider_branches_scan.py

      - name: Provider gateway conformance tests
        run: cargo test -p newengine-plugin-host service_gateway::registry --lib

      - name: Asset domain boundary scan
        run: python scripts/asset_domain_boundary_scan.py

      - name: Asset format descriptor scan
        run: python scripts/asset_format_boilerplate_scan.py

      - name: AssetManager codec sync scan
        run: python scripts/assetmanager_codec_sync_scan.py

      - name: Asset format contract tests
        run: cargo test -p newengine-asset-format-nef8 --lib

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose --lib

      - name: Doc tests
        run: cargo test --workspace --doc

  miri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v7
      - name: Verify checkout revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$actual"
          test "$actual" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2
      - name: Cargo workspace metadata preflight
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - run: cargo miri setup
      - name: Run Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --workspace --lib --no-fail-fast

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v7
      - name: Verify checkout revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$actual"
          test "$actual" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2
      - name: Cargo workspace metadata preflight
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Coverage
        run: cargo tarpaulin --workspace --out Xml --exclude-files '*/tests/*'
      - uses: codecov/codecov-action@v3
        with:
          files: neocore2/cobertura.xml
