name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: No hidden runtime executors
        run: python scripts/no_hidden_thread_scan.py

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose --lib

      - name: Doc tests
        run: cargo test --workspace --doc

  miri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2
      - run: cargo miri setup
      - run: cargo miri test --workspace --lib --no-fail-fast

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocore2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neocore2
      - uses: taiki-e/install-action@cargo-tarpaulin
      - run: cargo tarpaulin --workspace --out Xml --exclude-files '*/tests/*'
      - uses: codecov/codecov-action@v3
        with:
          files: neocore2/cobertura.xml
